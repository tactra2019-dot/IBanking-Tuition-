services:
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  notification:
    image: maven:3.9-eclipse-temurin-17
    working_dir: /app
    command: mvn spring-boot:run
    volumes:
      - ./notification-service:/app
      - notification_maven:/root/.m2
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?Thiếu khóa nội bộ}
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      - mailpit
volumes:
  notification_maven:
