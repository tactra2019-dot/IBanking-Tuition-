services:
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
  notification:
    image: ibanking-notification:local
    build: ./notification-service
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      NOTIFICATION_INTERNAL_KEY: ${NOTIFICATION_INTERNAL_KEY:?Thiếu khóa nội bộ}
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8085}:8085"
    depends_on:
      - mailpit
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
