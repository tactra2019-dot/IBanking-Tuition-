server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8085}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
spring:
  application:
    name: notification-service
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.debug: false
notification:
  internal-key: ${NOTIFICATION_INTERNAL_KEY:}
  from: ${MAIL_FROM:no-reply@ibanking.local}
logging:
  level:
    org.springframework.web: WARN
    org.springframework.mail: WARN
    org.eclipse.angus.mail: WARN
